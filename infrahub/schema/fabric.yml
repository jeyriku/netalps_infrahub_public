# Netalps DC fabric (leaf-spine, eBGP + EVPN-VXLAN), separate from network.yml.
# Load: infrahubctl schema load infrahub/schema/fabric.yml --branch main
---
version: "1.0"

nodes:

  - name: FabricDevice
    namespace: Netalps
    description: "Spine or leaf in the dc-fabric lab"
    label: "Fabric Device"
    icon: "mdi:router-network"
    human_friendly_id:
      - hostname__value
    order_by:
      - hostname__value
    uniqueness_constraints:
      - ["hostname__value"]
    attributes:
      - name: hostname
        kind: Text
        label: "Hostname"
        unique: true

      - name: role
        kind: Dropdown
        label: "Role"
        choices:
          - name: spine
            label: "Spine"
            color: "#7e57c2"
          - name: leaf
            label: "Leaf"
            color: "#26a69a"

      - name: asn
        kind: Number
        label: "BGP ASN"

      - name: loopback_ip
        kind: IPHost
        label: "Loopback IP"
        description: "Router-ID and VTEP source (ex: 10.1.1.1/32)"

      - name: clab_container
        kind: Text
        label: "Containerlab Container Name"
        optional: true
        description: "ex: clab-dc-fabric-leaf-01"

    relationships:
      - name: interfaces
        peer: NetalpsFabricInterface
        label: "Fabric Interfaces"
        cardinality: many
        direction: bidirectional
        optional: true

  - name: FabricInterface
    namespace: Netalps
    description: "eBGP unnumbered fabric link (IPv6 link-local)"
    label: "Fabric Interface"
    icon: "mdi:ethernet"
    order_by:
      - device__hostname__value
      - name__value
    attributes:
      - name: name
        kind: Text
        label: "Name"
        description: "ex: eth1"

    relationships:
      - name: device
        peer: NetalpsFabricDevice
        label: "Device"
        cardinality: one
        direction: bidirectional
        optional: false

  - name: FabricVrf
    namespace: Netalps
    description: "Tenant VRF routed over EVPN (symmetric IRB)"
    label: "Fabric VRF"
    icon: "mdi:layers-triple"
    human_friendly_id:
      - name__value
    uniqueness_constraints:
      - ["name__value"]
    attributes:
      - name: name
        kind: Text
        label: "Name"
        unique: true

      - name: l3_vni
        kind: Number
        label: "L3 VNI"
