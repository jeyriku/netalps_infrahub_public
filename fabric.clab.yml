---
# Lab : dc-fabric
# Description : Leaf-spine DC fabric — eBGP unnumbered underlay + EVPN-VXLAN overlay
# Images       : frrouting/frr:latest, nicolaka/netshoot:latest
#
# Topology :
#
#            spine-01 (AS 65000)          spine-02 (AS 65000)
#             eth1..eth4                   eth1..eth4
#                 │                            │
#     ┌───────────┼──────────┬─────────────────┼────── (each leaf: eth1 → spine-01, eth2 → spine-02)
#  leaf-01     leaf-02     leaf-03     leaf-04
#  AS 65101    AS 65102    AS 65103    AS 65104
#     │eth3       │eth3       │eth3       │eth3
#  host-01     host-02     host-03     host-04
#
#  VRF tenant1 : L3VNI 50001
#  VLAN 10     : L2VNI 10010, 192.168.110.0/24 (leaf-01, leaf-03)
#  VLAN 20     : L2VNI 10020, 192.168.120.0/24 (leaf-02, leaf-04)
#  Anycast gateway .1 on every leaf (same MAC)

name: dc-fabric

mgmt:
  network: clab-mgmt-dc-fabric
  ipv4-subnet: 172.20.37.0/24

topology:
  nodes:

    spine-01:
      kind: linux
      image: frrouting/frr:latest
      mgmt-ipv4: 172.20.37.11
      binds:
        - configs-fabric/daemons:/etc/frr/daemons
        - configs-fabric/spine-01/frr.conf:/etc/frr/frr.conf
        - configs-fabric/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.ipv6.conf.all.disable_ipv6=0
        - sysctl -w net.ipv4.conf.all.rp_filter=0
        - sysctl -w net.ipv4.conf.default.rp_filter=0

    spine-02:
      kind: linux
      image: frrouting/frr:latest
      mgmt-ipv4: 172.20.37.12
      binds:
        - configs-fabric/daemons:/etc/frr/daemons
        - configs-fabric/spine-02/frr.conf:/etc/frr/frr.conf
        - configs-fabric/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.ipv6.conf.all.disable_ipv6=0
        - sysctl -w net.ipv4.conf.all.rp_filter=0
        - sysctl -w net.ipv4.conf.default.rp_filter=0

    # VRF / VXLAN / anycast-gateway plumbing: configs-fabric/leaf-init.sh <vtep_ip> <vlan>
    leaf-01:
      kind: linux
      image: frrouting/frr:latest
      mgmt-ipv4: 172.20.37.21
      binds:
        - configs-fabric/daemons:/etc/frr/daemons
        - configs-fabric/leaf-01/frr.conf:/etc/frr/frr.conf
        - configs-fabric/vtysh.conf:/etc/frr/vtysh.conf
        - configs-fabric/leaf-init.sh:/leaf-init.sh
      exec:
        - sh /leaf-init.sh 10.1.1.1 10

    leaf-02:
      kind: linux
      image: frrouting/frr:latest
      mgmt-ipv4: 172.20.37.22
      binds:
        - configs-fabric/daemons:/etc/frr/daemons
        - configs-fabric/leaf-02/frr.conf:/etc/frr/frr.conf
        - configs-fabric/vtysh.conf:/etc/frr/vtysh.conf
        - configs-fabric/leaf-init.sh:/leaf-init.sh
      exec:
        - sh /leaf-init.sh 10.1.1.2 20

    leaf-03:
      kind: linux
      image: frrouting/frr:latest
      mgmt-ipv4: 172.20.37.23
      binds:
        - configs-fabric/daemons:/etc/frr/daemons
        - configs-fabric/leaf-03/frr.conf:/etc/frr/frr.conf
        - configs-fabric/vtysh.conf:/etc/frr/vtysh.conf
        - configs-fabric/leaf-init.sh:/leaf-init.sh
      exec:
        - sh /leaf-init.sh 10.1.1.3 10

    leaf-04:
      kind: linux
      image: frrouting/frr:latest
      mgmt-ipv4: 172.20.37.24
      binds:
        - configs-fabric/daemons:/etc/frr/daemons
        - configs-fabric/leaf-04/frr.conf:/etc/frr/frr.conf
        - configs-fabric/vtysh.conf:/etc/frr/vtysh.conf
        - configs-fabric/leaf-init.sh:/leaf-init.sh
      exec:
        - sh /leaf-init.sh 10.1.1.4 20

    host-01:
      kind: linux
      image: nicolaka/netshoot:latest
      mgmt-ipv4: 172.20.37.31
      exec:
        - ip addr add 192.168.110.11/24 dev eth1
        - ip link set eth1 up
        - ip route add 192.168.120.0/24 via 192.168.110.1

    host-02:
      kind: linux
      image: nicolaka/netshoot:latest
      mgmt-ipv4: 172.20.37.32
      exec:
        - ip addr add 192.168.120.12/24 dev eth1
        - ip link set eth1 up
        - ip route add 192.168.110.0/24 via 192.168.120.1

    host-03:
      kind: linux
      image: nicolaka/netshoot:latest
      mgmt-ipv4: 172.20.37.33
      exec:
        - ip addr add 192.168.110.13/24 dev eth1
        - ip link set eth1 up
        - ip route add 192.168.120.0/24 via 192.168.110.1

    host-04:
      kind: linux
      image: nicolaka/netshoot:latest
      mgmt-ipv4: 172.20.37.34
      exec:
        - ip addr add 192.168.120.14/24 dev eth1
        - ip link set eth1 up
        - ip route add 192.168.110.0/24 via 192.168.120.1

  links:
    - endpoints: ["leaf-01:eth1", "spine-01:eth1"]
    - endpoints: ["leaf-02:eth1", "spine-01:eth2"]
    - endpoints: ["leaf-03:eth1", "spine-01:eth3"]
    - endpoints: ["leaf-04:eth1", "spine-01:eth4"]
    - endpoints: ["leaf-01:eth2", "spine-02:eth1"]
    - endpoints: ["leaf-02:eth2", "spine-02:eth2"]
    - endpoints: ["leaf-03:eth2", "spine-02:eth3"]
    - endpoints: ["leaf-04:eth2", "spine-02:eth4"]
    - endpoints: ["leaf-01:eth3", "host-01:eth1"]
    - endpoints: ["leaf-02:eth3", "host-02:eth1"]
    - endpoints: ["leaf-03:eth3", "host-03:eth1"]
    - endpoints: ["leaf-04:eth3", "host-04:eth1"]
